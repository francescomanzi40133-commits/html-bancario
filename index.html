<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Intesa Sanpaolo</title>
  <style>
    body {
      background: #0d0f12;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      perspective: 1000px;
    }
    .hint { 
      margin-bottom: 25px; 
      color: #8a99ad; 
      font-size: 14px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }
    .card-container {
      width: 380px;
      height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }
    .card-container.flipped { 
      transform: rotateY(180deg); 
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      backface-visibility: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 15px rgba(0,95,75,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }
    /* Front Side */
    .card-front {
      background: linear-gradient(135deg, #005F4B 0%, #05241c 100%);
      padding: 22px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .bank-name { 
      font-weight: 800; 
      letter-spacing: 1.5px; 
      color: #ffffff; 
      font-size: 15px; 
    }
    .chip { 
      width: 45px; 
      height: 34px; 
      background: linear-gradient(135deg, #e6c875, #997a2a); 
      border-radius: 6px; 
    }
    .card-number { 
      font-size: 20px; 
      letter-spacing: 3px; 
      font-family: 'Courier New', Courier, monospace; 
      color: #ffffff; 
      margin-top: 15px; 
    }
    .card-details { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .label { 
      font-size: 9px; 
      color: #a3c2b8; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 2px; 
    }
    .val { 
      font-size: 13px; 
      font-weight: 600; 
      letter-spacing: 1px; 
      color: #fff; 
    }
    /* Back Side */
    .card-back {
      background: linear-gradient(135deg, #05241c 0%, #005F4B 100%);
      transform: rotateY(180deg);
      padding-top: 25px;
      box-sizing: border-box;
    }
    .magnetic-strip { 
      width: 100%; 
      height: 45px; 
      background: #000; 
    }
    .signature-bar {
      margin: 20px;
      background: #e0e0e0;
      height: 35px;
      border-radius: 4px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 15px;
      color: #111;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }
    .back-info { 
      padding: 0 20px; 
      font-size: 10px; 
      color: #a3c2b8; 
      text-align: center; 
    }
  </style>
</head>
<body>

  <div class="hint">🖱️ Clicca sulla carta per girarla</div>

  <div class="card-container" id="card" onclick="this.classList.toggle('flipped')">
    <!-- FRONT -->
    <div class="card-face card-front">
      <div class="card-header">
        <span class="bank-name">INTESA SANPAOLO</span>
        <span style="font-size: 12px; opacity: 0.8;">BLACK</span>
      </div>
      <div class="chip"></div>
      <div class="card-number" id="cardNumber">4000 0000 0000 0000</div>
      <div class="card-details">
        <div>
          <div class="label">Titolare Conto</div>
          <div class="val" id="cardHolder">NOME COGNOME</div>
        </div>
        <div>
          <div class="label">Codice Fiscale</div>
          <div class="val" id="cardCF">-----------</div>
        </div>
      </div>
    </div>

    <!-- BACK -->
    <div class="card-face card-back">
      <div class="magnetic-strip"></div>
      <div class="signature-bar">
        <span>CVV: <strong id="cardCVV">***</strong></span>
      </div>
      <div class="back-info">
        Questa carta è di proprietà di Intesa Sanpaolo.
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const dataStr = params.get('data');
    if (dataStr) {
      try {
        const decoded = JSON.parse(atob(dataStr));
        
        document.getElementById('cardHolder').textContent = (decoded.nome || 'N/A').toUpperCase();
        document.getElementById('cardCF').textContent = (decoded.cf || 'N/A').toUpperCase();
        
        // Garantisce che ci siano solo le 16 cifre della carta di credito (nessun IBAN o prefisso IT)
        let num = decoded.cardNumber || '4000 1234 5678 9010';
        num = num.replace(/IT/gi, '').trim();
        
        document.getElementById('cardNumber').textContent = num;
        document.getElementById('cardCVV').textContent = decoded.cvv || '123';
      } catch(e) {
        console.error("Errore nel caricamento della carta:", e);
      }
    }
  </script>
</body>
</html>
